[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minutes-ai"
version = "0.1.0"
description = "会議録・問い合わせから決定事項・タスク・未決事項を根拠付きで抽出する Python CLI（Claude API）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=2.3", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
minutes-ai = "minutes_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 行長はフォーマッタに任せる (日本語の文字列は折り返さない)
ignore = ["E501"]
