name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: 評価の再現 (コミット済みキャッシュのみ使用, API は呼ばない)
        run: |
          minutes-ai eval data/test --model claude-sonnet-5-5 --offline --report eval-test.md
          python scripts/compare_models.py > model-comparison.md
      - name: 評価結果をジョブサマリーに表示
        if: matrix.python-version == '3.12'
        run: cat model-comparison.md >> "$GITHUB_STEP_SUMMARY"
